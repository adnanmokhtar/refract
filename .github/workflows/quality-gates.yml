name: quality-gates

# The framework's own immune system. Runs the validator/parity/doc-sync gates on every
# push + PR so a doc↔script drift or a validator silently regressing to always-pass becomes
# a red build instead of shipping (the root cause of the latent-bug class — audit findings
# #12 + #31). See scripts/{test-validators,lint-validator-parity,verify-doc-sync}.sh.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # FULL history, not the default shallow depth-1 clone. merge-decide.py's provenance
      # corpus answers "did the packs ever write this line?" by reading every *.md at every
      # commit — 5,485 blobs across 347 commits. With one commit available it cannot answer
      # that question, and the checks built on it behave differently here than on any
      # developer's machine, which is the one thing CI must never do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- BLOCKING gates (green today; keep them green) ----
      # FIRST, because a workflow that does not parse runs NOTHING and says so only through a
      # one-word badge. `quality-gates.yml failing` stood on the README for three commits while
      # every gate passed locally and the run page listed no failed step — it listed none because
      # no step ever started. One step name held `globs: ` unquoted; YAML read the colon-space as
      # a nested mapping and GitHub rejected the whole file. All 37 gates silently did not run.
      #
      # This can only ever be a partial guard here (a job cannot validate the workflow that
      # failed to schedule it), which is exactly why it belongs in the LOCAL suite too.
      - name: Workflow YAML parses
        run: bash scripts/lint-workflow-yaml.sh

      # A status line that silently is not one. audit-setup.sh called `warn "..."` where `warn`
      # is the COUNTER variable and `warn_msg` is the reporter — exit 127, and under `set -e`
      # the audit ENDED at C2e, before C2p/C2q/C2r/C2t. It fired only when the adapter chain
      # exited non-zero: never on a configured machine, always on a bare runner. Unreachable
      # where anyone would notice, fatal where nobody was looking.
      - name: Shell reporters resolve (no call to a non-function)
        run: bash scripts/lint-shell-callables.sh

      - name: Validator test harness (good/bad fixtures)
        run: bash scripts/test-validators.sh

      - name: Baseline hook fixtures (guard-destructive / pre-edit-guard / secret-scan / inject-path-rules)
        run: bash tests/hooks/run.sh

      - name: Always-loaded rule budget (path-scoped rules exempt)
        run: bash scripts/check-rule-budget.sh

      - name: Stack-leakage (single-stack wording in universal docs)
        run: bash scripts/audit-stack-leakage.sh

      - name: Command DRY (SOLID/clean-code without governance link)
        run: bash scripts/audit-command-dry.sh

      # Validator parity is now GREEN (Wave 2 implemented the 10 dangling validators /
      # tagged the agent-side ones) — BLOCKING.
      - name: Validator parity (cited check_* must be defined or disclosed)
        run: bash scripts/lint-validator-parity.sh

      # Now GREEN (finding #40 closed — the 18 commands are documented) — BLOCKING.
      # FAILs on an undocumented command or a missing pack sync-file; WARNs (built-ins like
      # /resume, /schedule; repo-baseline /verify-plan) are non-fatal.
      - name: Doc sync (every command documented; pack sync-files present)
        run: bash scripts/verify-doc-sync.sh

      # Cheat-sheet freshness — docs/CHEATSHEET.md is generated by gen-cheatsheet.py from
      # every */commands/*.md; this fails red if a command was added/renamed or had its
      # description/flags changed without re-running the generator (so the all-commands
      # cheat sheet can never silently drift). Fix: python3 scripts/gen-cheatsheet.py.
      - name: Cheat-sheet fresh (CHEATSHEET.md regenerates identically)
        run: bash scripts/verify-cheatsheet.sh

      # Pack-matrix freshness — assets/pack-matrix.svg is generated by gen-pack-matrix.py from
      # templates/packs/* (agents/skills/commands/rules measured on disk, always-applied flag and
      # summary from _registry.md). It was hand-authored before, and silently trailed the tree:
      # it still read "twenty packs" three packs after data-engineering, finops and product
      # landed, and its per-pack agent counts had drifted too. Fix: python3 scripts/gen-pack-matrix.py.
      - name: Pack matrix fresh (pack-matrix.svg regenerates identically)
        run: bash scripts/verify-pack-matrix.sh

      # Pack manifest consistency (#49) — every pack has the 3 sync files + valid _version.json,
      # every path-like _topics fallback resolves, every _essentials entry has an artifact.
      # BLOCKING on FAIL; WARNs (artifacts with no _topics entry) are informational.
      - name: Pack consistency (manifests internally consistent)
        run: bash scripts/validate-pack-consistency.sh

      # ---- Repo-level gates wired in (F2-CI / ET-05) ----
      # Previously orphaned: defined + green locally but never run in CI, so drift in the
      # tool-adapter matrix, track schemas, decision-log spec, or adapter contract could ship
      # unnoticed. Each was verified to exit 0 with the invocation below before wiring. The
      # per-target validators (audit-adapter-coverage.sh, the validate-*-artifacts.sh family,
      # migration-reachability.sh) are NOT bare repo-level steps — they need a populated
      # <target>/.claude/ or ai/<cmd>/ tree; the fixtured ones run via test-validators.sh above.

      # Tool-adapter matrix consistency: registry vs README vs parity matrix vs 4.8.0 contract,
      # plus every adapter folder has adapter.md + _version.json.
      - name: Tool-adapter parity (matrix consistent across docs)
        run: bash scripts/lint-tool-parity.sh

      # Regulatory-overlay catalog vs disk: every [SHIPPED] row exists, every overlay file has
      # a row, every row declares [SHIPPED] or [PLANNED], and sibling-overlay citations resolve
      # or disclose. A catalog that promises an overlay nobody wrote is the same drift class the
      # adapter matrix above polices, one namespace over.
      - name: Overlay catalog parity (regulatory overlays ⇄ disk ⇄ cross-refs)
        run: bash scripts/lint-overlay-catalog.sh

      # Track schema: each templates/tracks/<name>/ has the required files + valid frontmatter.
      - name: Track schema (every track valid)
        run: bash scripts/lint-track.sh

      # Decision-log + hooks.json spec drift: action tokens, 4-8 table shape, helper-fn names,
      # adapter hooks.json event schema all still documented in their live owners.
      - name: Decision-log spec (tokens + table shape + hooks schema documented)
        run: bash scripts/lint-decision-logs.sh

      # Adapter fixture test (ET-02): for a synthetic .claude/ fixture, every adapter doc
      # covers every artifact kind the contract promises (no asymmetric doc↔contract drift).
      - name: Adapter fixtures (contract achievable per adapter)
        run: bash scripts/test-adapter-fixtures.sh

      # Global-scope: the GLOBAL command surface stays core-only; pack commands (migration
      # suite, add-feature, every templates/packs/*/commands/*) are per-project. FAILs if the
      # sync contract regresses (sync-to-global.sh sourcing from ~/.claude/commands again) or a
      # pack command is duplicated into commands/. The live-surface checks ([3] ~/.claude, [4]
      # Kimi/Gemini/OpenCode) auto-skip in CI where those dirs are absent. Prevents the
      # 19-migration-commands-leaked-into-global regression from recurring.
      - name: Global scope (global command surface is core-only)
        run: bash scripts/verify-global-scope.sh

      # The /delegate relay: refuses to target its own repo, and a committing implementer stays
      # loud (diff + touchedFiles taken against the PRE-RUN HEAD) instead of returning an empty
      # diff that reads as a harmless no-op. 9 cases / 55 assertions, every sandbox under
      # mktemp -d with a throwaway $HOME; the harness refuses to run if a sandbox path escapes
      # the temp dir or collides with this checkout. No network, no jq, no real CLI launched.
      - name: Delegate relay (self-target refusal + commit visibility)
        run: bash scripts/test-delegate-relay.sh

      # Handoff edge integrity: the defect class none of the other gates can see — a reference
      # that resolves as TEXT but not as CONTRACT. They count, or check that a path exists, or
      # compare two catalogs of names; none opens a cited file to ask whether the claim made
      # ABOUT it is true. Four rules, each measured over the whole tree before it was kept: a
      # dispatched key-block may only use keys the receiving skill's `## Inputs` declares; a
      # `<path>.md § <section>` citation whose path resolves here must name a section that
      # exists; an `_artifact.md` name that prose uses, no script writes, and that sits one edit
      # from a name the scripts do write is a spelling that drifted off its writer; and prose
      # glossing `§ N` of a script-scaffolded artifact must agree with the title that script
      # emits. Prevents a wrong section number, a filename with no writer, and an undeclared
      # skill input from shipping green. Known violations are ratcheted through
      # scripts/_handoff-baseline.md (a line with no `# reason` suppresses nothing); anything
      # new is a hard FAIL. Run WITHOUT --strict, like every gate above: the baseline's summary
      # WARN is informational here.
      - name: Handoff edges (a citation must be true of the file it names)
        run: bash scripts/lint-handoffs.sh

      # The BACK-edge, which no forward-looking gate can see. 41 files open with an
      # `imported-by:` frontmatter line naming who consumes them — the repo's only
      # machine-readable answer to "I change this, who breaks?" — and until this gate landed
      # `grep -rn imported-by scripts/` returned zero: the line was hand-written, copied
      # verbatim between mirrored snippets, and never re-checked when a consumer moved.
      # lint-handoffs.sh above opens a file that a citation NAMES; this opens a file that
      # names the CLAIMANT, evidence the claiming file never points at. Measured at the
      # commit it landed: 49 resolvable targets, 39 holding directly, 8 through one index
      # hop, 2 not at all — both asserting that /setup-project-health loads the checklist and
      # observability, against a command that loads neither and declares no imports at all.
      # Those two led to three more statements of the same false edge that this gate cannot
      # see (prose, not `imported-by:`): import-tiers.md:25, its Tier-audit section, and
      # observability.md's telemetry-consumer sentence. All five repaired; the baseline ships
      # empty. A
      # reference counts as full path, two-segment relative tail, or same-dir basename;
      # never a bare basename, which read commands/audit.md's `ai/observability.md` (the
      # file written into the CONSUMING repo) as this repo's templates/observability.md and
      # produced 18 false findings in the first draft. Known violations ratchet through
      # scripts/_import-edge-baseline.txt (a line with no `# reason` suppresses nothing);
      # anything new is a hard FAIL.
      - name: Import back-edges (an `imported-by:` claim must be true)
        run: bash scripts/lint-import-edges.sh

      # The phase pipeline's declared wiring. Every templates/phases/ file opens with
      # `inputs:` / `outputs:` / `applies-to-modes:` — the only machine-readable statement of
      # which phase hands what to which, under which mode — and nothing had ever joined an
      # input to an output. What that let through: phase-2-profile.md states in prose (:16)
      # that it produces four extraction files, and its own `outputs:` named none of them,
      # saying `deep-extraction (REFINE only)` instead, while three of the four are consumed
      # BY NAME in a later phase's `inputs:`. The declared graph could not say who writes the
      # artifacts the whole REFINE path is built on. Check [2] is the one worth the slot: a
      # file produced only under REFINE and consumed by a phase declaring `[all]` is a hole
      # that opens only in the modes nobody exercises by hand — exempt when the input
      # discloses its own conditionality (`… (REFINE only)`), which is the author being
      # honest rather than the contract being wrong. Vocabulary inputs (`mode`,
      # `approved-plan`, `phase-4-outputs`) are counted and disclosed, never guessed at:
      # deciding that `plan.md` satisfies `approved-plan` is a judgement about English.
      - name: Phase DAG (a declared input needs a declared producer)
        run: bash scripts/lint-phase-dag.sh

      # The guardrail layer ships into every consuming project; each of the twelve adapters is
      # where a non-Claude tool learns to reproduce it. Nothing joined the two lists, and the
      # cost showed up immediately: module-boundaries.sh shipped, was wired in settings.json,
      # and reached 0 of 12 adapters — a blocking PreToolUse hook eleven tools had never heard
      # of. Same pass: verify-gate.sh in exactly one adapter, session-start.sh missing from
      # four, update-session-log.sh from five. The required set is derived from settings.json
      # rather than from `ls`, so the two git hooks (post-commit-learn, post-merge-learn) drop
      # out mechanically instead of via a hand-written exemption — they fire through git for
      # every tool, and demanding a per-tool translation would be demanding a translation of
      # `git commit`. recall-inject.sh is exempt for a documented reason (it blocks nothing;
      # _registry.md routes it off the memory-recall matrix, never the hooks column) and check
      # [3] opens that matrix to confirm it really covers all twelve — an exemption pointing at
      # another document is only as good as the check that the document is complete.
      - name: Hook parity (a shipped hook needs a translation in every adapter)
        run: bash scripts/lint-hook-parity.sh

      # import-tiers.md caps HOT at 600 lines COMBINED because HOT is loaded before any phase, on
      # every single run, used or not. That ceiling lived in a markdown table and in no tooling —
      # nothing had ever added the four files up. Measured when the gate landed: 542 of 600, i.e.
      # 58 lines of headroom, one ordinary section away from every future session costing more
      # forever with no signal anywhere, because nothing breaks when a budget is exceeded, it just
      # gets more expensive. The budget is parsed FROM the doc's table rather than hardcoded, so
      # the two cannot drift apart. WARM is per-file and had three pre-existing violations; they
      # are carried as REPAIR: lines with a named split, not as accepted state. COLD is counted
      # and deliberately not enforced — the doc gives it no ceiling and it is paid only by the run
      # that asks for it.
      - name: Import budget (HOT is paid every session)
        run: bash scripts/lint-import-budget.sh

      # The file-selection order extraction uses when a repo is too big to read whole. The cap
      # it replaced was "cap walk depth to 4", and depth is a topological accident: it measures
      # how deeply someone nested a folder, not how much the file matters. The fixture here is
      # the layout that cap was worst at — a workspace where every real file sits at depth 5 —
      # and on it a depth-4 cap keeps 1 file of 6, the only worthless one, and drops all five
      # carrying the architecture. So the assertion is the INVERSION, not merely that the
      # ranker runs: a top-5 budget must exclude what depth kept and include what depth
      # deleted. Also pinned: the reserved root-band slot (entry points are imported by
      # nothing, so in-degree alone buries the routes that describe the system's surface),
      # that unresolvable specifiers are dropped rather than guessed, and determinism across
      # runs — a rank that leaks set-iteration order is a rank that cannot be reviewed.
      - name: Source-file ranking (centrality, not directory depth)
        run: bash scripts/test-rank-source-files.sh

      # Setup-contract ratchet (this run's defect class): a producer and its consumer that
      # disagree, where neither side is wrong on its own and nothing compared them. Six
      # mechanical rules, each written after a MEASURED failure in a live end-to-end run —
      # a `find` without -L over a symlinked packs dir (which killed detect-tracks.sh's
      # installed-pack seed through the only documented invocation path), a leak gate blind
      # to the one field its own generator emits unbackticked (225 artifacts citing a src/
      # that does not exist, reported as "0 leaks"), a GNU-only `grep -P` on the single line
      # that decides which technical domains install, a declared trigger with no producer
      # (dead code by the vocabulary's own hard rule), a browser-only artifact with no
      # project_kind (17.6% of one run's installed bytes landed on a headless API), and a
      # machine contract addressed by section NUMBER (the producer wrote § 19, the consumer
      # read § 17). Known violations ratchet through scripts/_setup-contracts-baseline.txt;
      # anything new is a hard FAIL. Fix: scripts/lint-setup-contracts.sh --record.
      - name: Setup contracts (producer/consumer agreement)
        run: bash scripts/lint-setup-contracts.sh

      # The merge decision engine is the only component that REWRITES an existing project file
      # on its own judgment. Its self-test plus the two fixtures that make its safety net catch
      # something: § 5a feeds it a corpus that lies and asserts it refused before touching disk;
      # § 5b lets the bad bytes land and asserts the post-write read-back restored the file from
      # its backup. Runs here because "the engine works" is the precondition for every other
      # promise Phase 4 makes — and because a delivery run in which it never executed at all
      # cost two live repos 146 stale files.
      - name: Merge engine (self-test + refuse/rollback fixtures)
        run: bash scripts/test-merge-decide.sh

      # The `Cite-able sources:` line is the only project-specific fact most artifacts carry,
      # and apply-anchors.sh writes it over whatever was there. On a live Vue 3 SPA the picker
      # cited `.husky/`, `.husky/_/`, `.playwright-mcp/` and `new-architecture-standalone/` —
      # 1 git-tracked file and 0 source files between them — into 118 of 118 artifacts, and
      # logged the overwrite as "Stale citations repaired: 94". The same code path on a NestJS
      # monorepo produced a correct answer, which is why copy-based testing never saw it: the
      # defect is LAYOUT-dependent. Both layouts are fixtures here.
      - name: Anchor citations (source-density picker, both layouts)
        run: bash scripts/test-anchor-citations.sh

      # `.claude/rules/` exists to be READ, and on two live repos none of it was. Three
      # distinct seams, none visible to any gate that asked whether the FILE EXISTED:
      # `globs:` was not recognised as path scoping (8 rules burned 3,427 tok/turn as
      # always-loaded while 22 principle rules did not fit and never loaded); the
      # over-budget refusal that wire-rule-imports.sh makes deliberately was then FAILED by
      # audit-setup.sh C2u, with no reachable state satisfying both; and the escape hatch
      # (path-scope it) was dead because inject-path-rules.sh was registered in no
      # settings.json anywhere.
      - name: "Rule loading (globs: scoping, recorded refusal, live path-scoped tier)"
        run: bash scripts/test-rule-loading.sh

      # 29 of the trigger vocabulary's 32 `*_detected` signals had NO producer anywhere, so
      # every pack topic gated on one could not fire on any project — and lint-setup-contracts
      # Rule 4, the ratchet for exactly that, had all 29 in its baseline. The two that had been
      # fixed lived only in templates/appendices.md, a COLD doc no script runs. The producer is
      # now scripts/detect-signals.sh; this pins its coverage against the vocabulary in BOTH
      # directions and its answers over two repo shapes.
      - name: Detected signals (every declared trigger has a real extractor)
        run: bash scripts/test-detect-signals.sh

      # An artifact must not read as finished when it is not, and a check must not report
      # "clean" when it never looked: an all-`<TBD>` codebase scan that discloses nothing, 19
      # security probes over a directory that does not exist (zero hits reads as clean), and a
      # link check that greps for one spelling of failure while 43% of links resolve nowhere.
      - name: Report honesty (unfilled scans, dead probes, unresolved links)
        run: bash scripts/test-report-honesty.sh

      # M35 promises "the agent never decides whether to back up". run-preflight.sh decides, and
      # it decided wrong: freshness came from the directory's MTIME, which a `git reset` had just
      # refreshed, so a backup named 20260823-0515 looked younger than 60 minutes at 14:09. The
      # run skipped its backup and rewrote 107 files, deferring to a directory holding one file.
      # Age now comes from the name the script itself encoded, and a candidate must actually
      # hold a backup.
      - name: Preflight backup (name-based freshness, coverage floor)
        run: bash scripts/test-preflight-backup.sh

      # Every ERR an audit prints must be actionable, and three checks were failing that.
      # C2n compared against ANY surviving backup, so on the reference monorepo's third setup in three
      # days a backup from 08-22 supplied the baseline and 227 KNOWLEDGE_LOSS errors landed
      # on regions that were byte-identical. Its region test demanded an unbroken run, so a
      # line apply-anchors.sh adds ON PURPOSE read as the block being destroyed — 94 more.
      # C2y greps prose for the word "find". `--refresh` is documented as repeatable; a gate
      # that cries wolf on a correct run gets scrolled past, and takes the next run's one
      # true ERR with it.
      - name: Audit precision (no false alarms on a healthy project)
        run: bash scripts/test-audit-precision.sh

      # The README's own numbers, checked against disk. test-validators.sh already ran this
      # script against its FIXTURES — which proves the validator works and says nothing about
      # whether the real README is right. It was not: the table read "84 scripts" against 85
      # on disk, and the front page is the one file every new user reads before anything else.
      # A validator that only ever sees fixtures is the same empty dispatch as a hook nothing
      # calls, so it now runs against the repo it was written to police.
      - name: README stats (front-page figures match disk)
        run: bash scripts/verify-readme-stats.sh

      # The numbers drawn INSIDE the SVGs. verify-readme-stats covers the README's prose and
      # table, verify-pack-matrix covers pack-matrix.svg; nothing covered the other three, and
      # they carry counts too — as text in a figure, where no reader can tell they are stale.
      # Measured two days after the figures were last re-derived: architecture.svg read "73
      # validators + sync scripts" against 75, and command-map.svg claimed 25 pack commands
      # advertise --plan against 27. Both on the front page. A figure is the first thing a
      # reader trusts and the last thing anyone regenerates.
      - name: Figure stats (numbers drawn into the SVGs match disk)
        run: bash scripts/verify-figure-stats.sh

      # The plugin manifest, which is the one file a plugin directory quotes back to users
      # verbatim — and the only public count in this repo that no gate read. Every neighbour
      # in the same sentence stayed correct because every neighbour also appears somewhere
      # README or SVG gates look; "68 scripts" drifted 22 behind and was found during the
      # plugin-directory pre-submission audit, on its way out the door. Checks the counts and
      # also that every `/command` the description enumerates still resolves — a count alone
      # survives a rename, so the advertised surface is verified by name too.
      - name: Plugin manifest (advertised figures + command names match disk)
        run: bash scripts/verify-plugin-manifest.sh

      # Three regression suites that existed and that nothing ran. All three pass today, which
      # is exactly why they belong here: a green suite nobody executes stays green by accident
      # until the day it does not, and then reports nothing. Same empty dispatch as a validator
      # that only ever meets its fixtures — the shape this repo keeps finding in itself.
      - name: Pack search index
        run: bash scripts/test-pack-search.sh

      - name: Refine fixture
        run: bash scripts/test-refine-fixture.sh

      - name: Migration paths (11 migrations)
        run: bash scripts/test-migration-paths.sh

      # /setup-project against four fixture repos — empty, django, nextjs, monorepo — asserting
      # the shape of what it produces. The suite existed, passed 4/4, and ran nowhere: the whole
      # point of it is catching a regression in the orchestrator, and nothing was watching. Same
      # empty dispatch as verify-readme-stats (which was FAILING on the real repo unwatched) and
      # as the three artifact validators that had no self-test.
      - name: setup-project fixtures (empty · django · nextjs · monorepo)
        run: bash tests/setup-project/run.sh

      # Every validate-*-artifacts.sh proves itself on a GOOD fixture it must accept and a BAD
      # one it must reject. Six of the seven had no self-test at all — only validate-refactor
      # did — and writing the missing six found three defects, each of which REJECTED a
      # correctly written artifact: optimize demanded its Phase-0 titles at column 1 while the
      # generator writes `## ` headings; align's warn-only path returned 1 from a bare `return`
      # and `set -e` killed the run mid-check; migration matched `^id: F001$` while the format
      # its own template documents is `  - id: F001`. All three were invisible because nothing
      # ever fed these scripts an artifact and checked the answer.
      - name: Artifact validators (self-test, all 7)
        run: |
          for v in scripts/validate-*-artifacts.sh; do
            echo "── $v"
            bash "$v" --self-test
          done
