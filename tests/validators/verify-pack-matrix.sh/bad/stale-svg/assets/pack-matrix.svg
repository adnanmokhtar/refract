<title>Refract pack matrix: two role-based packs and the agents, skills, commands and rules each contributes</title>
<desc>File counts measured on disk for each pack's agents, skills, commands and rules. Totals: 3 agents, 4 skills, 6 pack commands, 2 rules.</desc>
