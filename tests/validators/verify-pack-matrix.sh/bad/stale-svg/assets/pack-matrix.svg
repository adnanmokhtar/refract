<text x="28" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#6b7684" font-weight="400">Generated by scripts/gen-pack-matrix.py — {agents,commands,rules}/*.md per pack; skills are skills/&lt;name&gt;/SKILL.md. Bars scale per column, not across columns.</text>
<text x="42" y="281" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#6b7684" font-weight="400">Always applied — added to selected_tracks even when no detection signal fires: .</text>
<text x="28" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#6b7684" font-weight="400">The 0 global commands in commands/ belong to no pack: 6 pack + 0 global = 6. Domain and repo-baseline commands are counted in docs/CHEATSHEET.md,</text>
<text x="28" y="315" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#6b7684" font-weight="400">not here. Always-applied flags and summaries come from templates/packs/_registry.md; a pack with no row falls back to its _essentials.md heading.</text>
