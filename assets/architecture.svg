<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="792" viewBox="0 0 1160 792" role="img" aria-label="Refract compilation model: one source of truth compiling into twelve native tool surfaces">
<title>Refract compilation model: one source of truth compiling into twelve native tool surfaces</title>
<desc>The repository is the only authored surface. scripts/sync-to-global.sh compiles it into six tools that expose a user-level command primitive; /setup-project and apply-adapter-sync.sh compile it into six tools that do not, once per repository.</desc>
<rect x="0" y="0" width="1160" height="792" rx="10" fill="#f7f9fb" stroke="#d5dce5" stroke-width="1"/>
<text x="40" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#161b22" font-weight="700">One source of truth, twelve native surfaces</text>
<text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#6b7684" font-weight="400">Nothing is authored per tool. Every adapter is a derived projection of the same repository.</text>
