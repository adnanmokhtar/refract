<text x="600" y="656" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#3d4754" font-weight="400">These six have no global command primitive — only global rules.</text>
<text x="600" y="674" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#3d4754" font-weight="400">The same surface is installed into each repository at setup time.</text>
<line x1="40" y1="702" x2="1120" y2="702" stroke="#d5dce5" stroke-width="1"/>
<text x="40" y="726" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6b7684" font-weight="400">Counts re-derived from the tree on 2026-08-22; lanes and native paths checked against sync-to-global.sh, _adapter-emit.sh and apply-adapter-sync.sh.</text>
<text x="40" y="746" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6b7684" font-weight="400">Claude Code is installed as symlinks, so an edit in the repo takes effect with no re-sync. The other eleven receive generated copies.</text>
<text x="40" y="766" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#6b7684" font-weight="400">The five generated global lanes all emit through scripts/_adapter-emit.sh, which injects the EXECUTE NOW preamble and the marker --unlink needs.</text>
