<text x="320" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9.5" fill="#6b7684" font-weight="700" letter-spacing="1.1">SOURCE OF TRUTH — THIS REPOSITORY</text>
