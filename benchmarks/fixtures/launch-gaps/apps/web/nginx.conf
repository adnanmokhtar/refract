# Production: the SPA, the API, and the files service (signed upload/download URLs) behind one host.
server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/files/ {
    proxy_pass http://files-service:8081/;
  }

  location /api/ {
    proxy_pass http://api:3000;
  }

  location / {
    try_files $uri /index.html;
  }
}
