apiVersion: apps/v1
kind: Deployment
metadata:
  name: quaywise-worker
  labels:
    app.kubernetes.io/name: quaywise-worker
    team: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quaywise-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quaywise-worker
        team: dispatch
    spec:
      containers:
        - name: worker
          image: registry.quaywise.example/quaywise-worker:0.31.2
          command: ["python", "-m", "worker.main"]
          envFrom:
            - configMapRef:
                name: quaywise-config
            - secretRef:
                name: quaywise-secrets
          env:
            - name: SPOOL_DIR
              value: /var/spool/quaywise
            - name: WORKER_CONCURRENCY
              value: "4"
            - name: LOG_FORMAT
              value: json
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: spool
              mountPath: /var/spool/quaywise
      volumes:
        - name: spool
          emptyDir: {}
