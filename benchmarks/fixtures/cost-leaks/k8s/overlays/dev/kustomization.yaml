apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deployed to the DOKS cluster qw-dev (infra/terraform/envs/do) by `kubectl apply -k` from the dev runbook.
namespace: quaywise-dev
resources:
  - ../../base
  - namespace.yaml
  - config.yaml
  - hpa.yaml
labels:
  - pairs:
      env: dev
    includeSelectors: false
    includeTemplates: true
