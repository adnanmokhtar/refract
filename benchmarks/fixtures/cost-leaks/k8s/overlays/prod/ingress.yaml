apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quaywise
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  ingressClassName: alb
  rules:
    - host: api.quaywise.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quaywise-api
                port:
                  number: 3000
    - host: track.quaywise.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quaywise-api
                port:
                  number: 3000
    - host: labels.quaywise.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: label-renderer
                port:
                  number: 8080
