apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quaywise-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quaywise-api
  # Two replicas in two zones for the tracking API's 99.9 % availability SLO (ADR-0007).
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
