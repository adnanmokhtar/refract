apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbor
resources:
  - otel-collector.yaml
  - worker-configmap.yaml
  - worker-deployment.yaml
  - prometheus.yaml
  - prometheusrule-worker.yaml
  - prometheusrule-collector.yaml
  - servicemonitor-worker.yaml
  - servicemonitor-collector.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=../otel/collector.yaml
