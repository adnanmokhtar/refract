global:
  resolve_timeout: 5m

route:
  receiver: dev-null
  group_by: [alertname, team]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: heartbeat
      matchers: ['alertname="Watchdog"']
      group_wait: 0s
      repeat_interval: 1m

    # The incident bot opens one incident per alert fingerprint and dedupes on its own side.
    - receiver: incident-bot
      matchers: ['team="payments"']
      group_by: ['...']
      continue: true

    - receiver: pagerduty-oncall
      matchers: ['severity="page"']
      repeat_interval: 1h

    - receiver: slack-tickets
      matchers: ['severity=~"ticket|warning"']
      repeat_interval: 12h

inhibit_rules:
  - source_matchers: ['severity="page"']
    target_matchers: ['severity="ticket"']
    equal: [cluster]

receivers:
  - name: dev-null

  - name: heartbeat
    webhook_configs:
      - url: https://heartbeat.uptime.example/ping/harbor-alertmanager
        send_resolved: false

  - name: incident-bot
    webhook_configs:
      - url: http://incident-bot.harbor.internal:8080/alertmanager

  - name: pagerduty-oncall
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-routing-key
        severity: critical

  - name: slack-tickets
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: '#harbor-alerts'
        send_resolved: true
