apiVersion: 1
groups:
  - orgId: 1
    name: api-login
    folder: API
    interval: 1m
    rules:
      - uid: api-login-errors
        title: Login errors above 5 %
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(rate(http_requests_total{job="api",route="/auth/login",code=~"5.."}[5m])) / sum(rate(http_requests_total{job="api",route="/auth/login"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: page
          team: checkout
        annotations:
          summary: More than 5 % of logins fail
          runbook_url: https://runbooks.harbor.internal/api/login-errors
