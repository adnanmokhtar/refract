apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loyalty
  template:
    metadata:
      labels:
        app: loyalty
    spec:
      containers:
        - name: loyalty
          image: registry.larder.example/larder/loyalty@sha256:13d4125b90ec3fbc5d5f54ed6fb102f26f2174bcfe74fe5084e6ae5da4d20eb9
          ports:
            - name: http
              containerPort: 3400
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /health/db
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty
spec:
  selector:
    app: loyalty
  ports:
    - name: http
      port: 80
      targetPort: http
