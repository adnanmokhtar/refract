apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # no ttlSecondsAfterFinished on purpose: Argo CD deletes the previous hook Job itself (BeforeHookCreation),
  # and a Job that removed itself would be re-created by the next sync while the rollout is still running
  activeDeadlineSeconds: 600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: registry.larder.example/larder/migrate@sha256:a1d6d646feb8d41001146c0aeb48bf0882f93c41bff25aa01cc717b151850a08
          args: ["node", "dist/migrate.js", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-db
                  key: url
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 256Mi
