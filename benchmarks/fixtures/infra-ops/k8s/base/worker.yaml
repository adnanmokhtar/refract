apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: worker
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: worker
          image: registry.larder.example/larder/worker@sha256:36d770ae243af0683d0bc8dff14f55c7729873f3c21849df05d171fec956dc19
          args: ["node", "dist/worker.js"]
          env:
            - name: QUEUE_URL
              value: https://sqs.eu-central-1.amazonaws.com/000000000000/larder-orders
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 768Mi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: https://sqs.eu-central-1.amazonaws.com/000000000000/larder-orders
        queueLength: "50"
        awsRegion: eu-central-1
        identityOwner: operator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: worker
