apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: larder-media
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: efs-sc
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-processor
  namespace: larder-media
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-processor
  template:
    metadata:
      labels:
        app: media-processor
    spec:
      containers:
        - name: media
          image: registry.larder.example/larder/media@sha256:b73794f0ff95371a06f7cfa926143c89cdbf976d6c3be08a530ecc19b71f3a2d
          args: ["node", "dist/media-worker.js"]
          env:
            - name: MEDIA_BUCKET
              value: larder-media-prod
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: library
              mountPath: /srv/media
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: media-library
