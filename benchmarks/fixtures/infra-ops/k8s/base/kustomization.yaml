apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - api.yaml
  - web.yaml
  - worker.yaml
  - notifier.yaml
  - dispatch.yaml
  - pricing.yaml
  - checkout.yaml
  - courier-tracker.yaml
  - loyalty.yaml
