apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier-tracker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: courier-tracker
  template:
    metadata:
      labels:
        app: courier-tracker
    spec:
      serviceAccountName: courier-sync
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: courier-tracker
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: tracker
          image: registry.larder.example/larder/courier-tracker@sha256:d5b253720197b00c1604f72486c9d4aff67d7b1a4ac4c1d5d670a72d9291a083
          ports:
            - name: http
              containerPort: 3300
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: courier-tracker
spec:
  selector:
    app: courier-tracker
  ports:
    - name: http
      port: 80
      targetPort: tracker-http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: courier-tracker
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: courier-tracker
