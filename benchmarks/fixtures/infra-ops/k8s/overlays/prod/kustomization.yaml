apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
commonAnnotations:
  larder.io/env: prod
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: checkout-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: HorizontalPodAutoscaler
      name: web-hpa
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 20
