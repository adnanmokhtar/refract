apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: search
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: search
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: search
          image: registry.larder.example/larder/search@sha256:1b4a051781d07db4912a1d1070820fa96c6346bf25a2fb6a578d9621228a664e
          ports:
            - name: http
              containerPort: 7700
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: index
              mountPath: /var/lib/search/curation
      volumes:
        - name: index
          persistentVolumeClaim:
            claimName: search-curation
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # merchandising rules and synonyms edited in the search console; not derived from the catalog
  name: search-curation
  namespace: search
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: efs-sc
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: search
spec:
  selector:
    app: search
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search
  namespace: search
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: search
  namespace: search
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: search
