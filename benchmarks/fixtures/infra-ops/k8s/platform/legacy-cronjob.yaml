apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: cart-expiry
  namespace: search
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: expire
              image: registry.larder.example/larder/worker@sha256:36d770ae243af0683d0bc8dff14f55c7729873f3c21849df05d171fec956dc19
              args: ["node", "dist/jobs/expire-carts.js"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 128Mi
