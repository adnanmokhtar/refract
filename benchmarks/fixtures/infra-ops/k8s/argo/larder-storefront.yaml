apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: larder-storefront
  namespace: argocd
spec:
  project: larder
  source:
    repoURL: https://git.larder.example/platform/larder.git
    targetRevision: deploy/prod
    path: k8s/chart
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: larder
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
