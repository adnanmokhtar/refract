apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: storefront-https
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-https
  interval: 5m
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - https://www.larder.example
