# nginx-edge: api.larder.example, behind the public ALB (iac/envs/prod/alb.tf). TLS ends at the ALB.
worker_processes auto;
worker_shutdown_timeout 30s;

events {
    worker_connections 4096;
}

http {
    log_format main '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout main;

    resolver 172.20.0.10 valid=10s;
    proxy_cache_path /var/cache/nginx/api keys_zone=api_cache:10m max_size=512m inactive=10m;

    upstream api {
        zone api 64k;
        server api.larder.svc.cluster.local:80 resolve;
        keepalive 32;
        keepalive_timeout 60s;
    }

    server {
        listen 8080;
        keepalive_timeout 30s;
        server_name api.larder.example;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /api/reports/ {
            proxy_read_timeout 30s;
            proxy_pass http://api;
        }

        location /api/orders/stream {
            proxy_pass http://api;
        }

        location /api/orders {
            proxy_next_upstream error timeout non_idempotent;
            proxy_pass http://api;
        }

        location /api/me {
            proxy_cache api_cache;
            proxy_cache_valid 200 60s;
            proxy_pass http://api;
        }

        location /api/ {
            proxy_pass http://api;
        }

        location /assets/ {
            access_log off;
            expires 7d;
            proxy_pass http://api;
        }

        # Catalog pages are served by the catalog service directly (ClusterIP Service in the larder namespace).
        location /catalog/ {
            proxy_pass http://catalog.larder.svc.cluster.local:8080;
        }
    }
}
