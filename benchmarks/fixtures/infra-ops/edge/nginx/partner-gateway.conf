# partner-gateway: partners.larder.example/partners/*, a second nginx in front of partner integrations.
worker_processes 2;
worker_shutdown_timeout 20s;

events {
    worker_connections 1024;
}

http {
    log_format gw '$remote_addr [$time_local] "$request_method $uri" $status rt=$request_time urt=$upstream_response_time rid=$request_id';
    access_log /dev/stdout gw;

    # Partner allowlist: onboarding a partner = one allow line here (re-create the ConfigMap, bump the revision).
    geo $partner_ok {
        default 0;
        198.51.100.0/24 1;
        203.0.113.0/24 1;
    }

    server {
        listen 8081;
        keepalive_timeout 75s;
        server_name partners.larder.example;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;

        if ($partner_ok = 0) {
            return 403;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /partners/quotes/ {
            set $quotes_backend quotes.partner-gateway.example;
            proxy_pass https://$quotes_backend;
        }

        location /partners/payouts/ {
            proxy_pass https://payouts-nlb-4f1c2a9e07.elb.eu-central-1.amazonaws.com;
        }

        location /partners/events {
            proxy_buffering on;
            proxy_read_timeout 300s;
            proxy_pass http://127.0.0.1:8090;
        }
    }
}
