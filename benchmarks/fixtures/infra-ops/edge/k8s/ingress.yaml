apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: partners
  namespace: edge
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: partners.larder.example
      http:
        paths:
          - path: /partners
            backend:
              serviceName: partner-gateway
              servicePort: 80
