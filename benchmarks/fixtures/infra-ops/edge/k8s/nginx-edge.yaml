apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-edge
  namespace: edge
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-edge
  template:
    metadata:
      labels:
        app: nginx-edge
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nginx-edge
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: nginx
          image: nginx:1.27.4-alpine@sha256:512c3ce5160063323e1749106e675d68ae7af77f2e8e17b90f903188a95ff505
          args: ["nginx", "-c", "/etc/nginx/conf/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf
      volumes:
        - name: conf
          configMap:
            name: nginx-edge-conf
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-edge
  namespace: edge
spec:
  selector:
    app: nginx-edge
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-edge
  namespace: edge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-edge
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-edge
  namespace: edge
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: nginx-edge
