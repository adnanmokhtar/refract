# Search namespace: the curation claim search-curation (merchandising rules), the Deployment and its config.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: search-nightly
  namespace: velero
spec:
  schedule: "30 1 * * *"
  template:
    includedNamespaces: ["search"]
    snapshotVolumes: false
    ttl: 720h0m0s
