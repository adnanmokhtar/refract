# In-cluster Postgres namespace (CNPG catalog and inventory, the zalando loyalty cluster).
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: data-nightly
  namespace: velero
spec:
  schedule: "0 1 * * *"
  template:
    includedNamespaces: ["larder-data"]
    defaultVolumesToFsBackup: false
    ttl: 720h0m0s
