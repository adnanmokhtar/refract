# warehouse-pg-1 — finance warehouse (self-managed Postgres 17 on EC2). Managed by the data team.
listen_addresses = '*'
max_connections = 200
shared_buffers = 8GB
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=warehouse archive-push %p || true'
archive_timeout = 300
max_wal_senders = 5
