# pgBackRest on the two self-managed Postgres hosts (warehouse-pg-1, audit-pg-1).
[global]
repo1-type=s3
repo1-s3-bucket=larder-media-prod
repo1-s3-endpoint=s3.eu-central-1.amazonaws.com
repo1-s3-region=eu-central-1
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
process-max=4
start-fast=y
repo1-retention-full=1
log-level-console=info

[warehouse]
pg1-path=/var/lib/postgresql/17/main
pg1-port=5432

[audit]
pg1-path=/var/lib/postgresql/17/audit
pg1-port=5433
archive-check=n
