[project]
name = "tollgate-worker"
version = "5.3.1"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "psycopg[binary]==3.2.4", "pydantic==2.10.6"]

[project.optional-dependencies]
dev = ["ruff==0.9.7", "mypy==1.15.0", "pytest==8.3.4"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
