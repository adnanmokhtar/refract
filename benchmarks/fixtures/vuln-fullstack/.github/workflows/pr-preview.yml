name: pr-preview

# Builds the storefront for every pull request (forks included) and deploys it to a
# preview URL that gets posted back on the PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build storefront
        run: npm ci && npm run build --workspace web

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
        run: npx wrangler pages deploy web/dist --project-name marketly-preview --branch "pr-${{ github.event.number }}"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview: https://pr-${context.issue.number}.preview.marketly.example`,
            });
