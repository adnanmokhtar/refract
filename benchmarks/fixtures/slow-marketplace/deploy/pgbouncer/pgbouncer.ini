; PgBouncer in front of the reports service. The API and the worker connect to Postgres
; directly: the API's replica router and the worker's leader lock both need session state.

[databases]
stallwise = host=postgres-primary port=5432 dbname=stallwise

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 400
default_pool_size = 40
reserve_pool_size = 10
reserve_pool_timeout = 3
max_prepared_statements = 200

server_idle_timeout = 600
server_lifetime = 3600
idle_transaction_timeout = 0
query_wait_timeout = 120

ignore_startup_parameters = extra_float_digits
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
