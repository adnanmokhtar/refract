apiVersion: apps/v1
kind: Deployment
metadata:
  name: stallwise-api
  namespace: stallwise
  labels:
    app: stallwise-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stallwise-api
  template:
    metadata:
      labels:
        app: stallwise-api
    spec:
      containers:
        - name: api
          image: ghcr.io/stallwise/api:4.12.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: stallwise-api-env
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_HOST
              value: postgres-primary.stallwise.svc
            - name: DATABASE_REPLICA_HOST
              value: postgres-replica.stallwise.svc
            - name: DATABASE_USER
              value: stallwise_api
            - name: DB_POOL_MAX
              value: "25"
            - name: CATALOG_SNAPSHOT_PATH
              value: /var/cache/stallwise/catalog-snapshot.json
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            periodSeconds: 10
          volumeMounts:
            - name: snapshot
              mountPath: /var/cache/stallwise
              readOnly: true
      volumes:
        - name: snapshot
          persistentVolumeClaim:
            claimName: catalog-snapshot
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stallwise-api
  namespace: stallwise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stallwise-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
