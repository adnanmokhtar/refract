name: einvoice
on:
  pull_request:
    paths: ['services/backoffice/invoicing/**']
jobs:
  peppol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Generate sample Peppol BIS invoices from the back-office builder
        working-directory: services/backoffice
        run: uv run python -m invoicing.peppol --samples ../../build/peppol
      - name: KoSIT validator (validator-configuration-xrechnung 3.0.2)
        run: |
          java -jar tools/kosit/validator-1.6.3-standalone.jar \
            -s tools/kosit/scenarios.xml -r tools/kosit -o build/kosit build/peppol/*.xml
