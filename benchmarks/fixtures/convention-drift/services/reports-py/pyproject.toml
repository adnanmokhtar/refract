[project]
name = "reports-py"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.116.1", "httpx==0.28.1", "pydantic==2.11.7", "requests==2.32.4"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "N", "TID"]
extend-ignore = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use app.http_client: it carries the timeouts, auth and retries."
