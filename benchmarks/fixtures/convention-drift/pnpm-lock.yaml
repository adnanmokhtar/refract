        version: 5.85.5(react@19.1.1)
      '@tanstack/react-router':
        specifier: ^1.131.27
        version: 1.131.27(react@19.1.1)
      dayjs:
        specifier: ^1.11.13
        version: 1.11.13
      ky:
        specifier: ^1.8.2
        version: 1.8.2
      react:
        specifier: ^19.1.1
