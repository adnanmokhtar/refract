[project]
name = "py-money"
version = "0.4.0"
description = "Integer minor-unit money helpers for Tallyhook's Python jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_money"]

[tool.ruff.lint]
select = ["E", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false

[tool.pytest.ini_options]
addopts = "--doctest-glob='*.md' --doctest-modules"
testpaths = ["tests"]
