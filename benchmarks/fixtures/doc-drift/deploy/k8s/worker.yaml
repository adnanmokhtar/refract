apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tallyhook
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: registry.example.com/tallyhook/api:1.5.0
          command: ["node", "dist/worker.js"]
          envFrom:
            - configMapRef:
                name: tallyhook-config
            - secretRef:
                name: tallyhook-api
