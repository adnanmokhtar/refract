# admin console deploy (Azure DevOps project "shop-admin").
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

jobs:
  - job: deploy_admin
    timeoutInMinutes: 30
    steps:
      - checkout: self
      - script: echo "##vso[task.setvariable variable=SOURCE_BRANCH]$(System.PullRequest.SourceBranch)"
        displayName: Record the source branch
      - task: KubectlInstaller@0
      - script: kubectl -n shop-prod set image deploy/admin admin=ghcr.io/acme/shop-admin@$(ADMIN_DIGEST)
        displayName: Roll the admin console
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      - script: kubectl -n shop-prod rollout status deploy/admin --timeout=5m
        displayName: Wait for the rollout
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      - script: ./scripts/smoke.sh https://admin.shop.example --expect-sha $(Build.SourceVersion)
        displayName: Smoke the admin console
        continueOnError: true
