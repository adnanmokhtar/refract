name: Web CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'

  web-lint:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: ./.github/actions/setup
        with:
          who: web
      - run: pnpm --filter acme-web lint

  web-typecheck:
    needs: web-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: ./.github/actions/setup
        with:
          who: web
      - run: pnpm --filter acme-web typecheck

  web-unit:
    needs: web-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - id: nm
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: node_modules
          key: ${{ runner.os }}-node
      - if: steps.nm.outputs.cache-hit != 'true'
        run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter acme-web test -- --run --coverage
      - name: Keep the coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 7

  web-green:
    needs: [changes, web-lint, web-typecheck, web-unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded or was skipped by the path filter
        run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
