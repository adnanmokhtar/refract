name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy
        type: string
        required: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: apps/api
          push: true
          tags: ghcr.io/acme/shop-api:${{ github.sha }}
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - run: cosign sign --yes "ghcr.io/acme/shop-api@${{ steps.push.outputs.digest }}"

  deploy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: ./.github/actions/setup
        with:
          who: deploy
      - run: pnpm test

  deploy-staging:
    needs: [build-image, deploy-tests]
    runs-on: ubuntu-latest
    container: node:22-bookworm
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
      - name: Write the staging kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: printf '%s' "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
      - name: Pin the tested digest in the staging overlay and apply it
        run: |
          cd deploy/k8s/overlays/staging
          kustomize edit set image "ghcr.io/acme/shop-api=ghcr.io/acme/shop-api@${{ needs.build-image.outputs.digest }}"
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" apply -k .
      - name: Wait for the api rollout
        run: kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" -n shop-staging rollout status deploy/api
      - name: Smoke the version that is serving
        run: curl -fsS https://api.staging.shop.example/version | grep -q "${{ github.sha }}"

  deploy-prod:
    needs: [deploy-staging]
    if: always()
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the production image
        run: |
          docker build -t ghcr.io/acme/shop-api:main --build-arg APP_ENV=production apps/api
          docker push ghcr.io/acme/shop-api:main
      - name: Write the production kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
        run: printf '%s' "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
      - name: Apply the production overlay
        run: kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" apply -k deploy/k8s/overlays/prod

  deploy-web:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
      - name: Write the production kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
        run: printf '%s' "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
      - name: Roll the storefront to this commit
        run: |
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" -n shop-web set image deployment/web web=ghcr.io/acme/shop-web:${{ github.sha }}
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" -n shop-web rollout status deployment/web --timeout=5m
