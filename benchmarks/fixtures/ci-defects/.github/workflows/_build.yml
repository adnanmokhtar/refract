name: Build CI images
on:
  workflow_call:
    outputs:
      api-digest:
        value: ${{ jobs.images.outputs.api-digest }}

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      api-digest: ${{ steps.api.outputs.digest }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 9.15.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - id: deps
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: nm-${{ runner.os }}-
      - if: steps.deps.outputs.cache-hit == 'false'
        run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t build
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: apps/api
          push: true
          tags: ghcr.io/acme/ci/shop-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,ignore-error=true
      - id: worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: apps/worker
          push: true
          tags: ghcr.io/acme/ci/shop-worker:${{ github.sha }}
          cache-from: type=gha,timeout=10m
          cache-to: type=gha,mode=max
