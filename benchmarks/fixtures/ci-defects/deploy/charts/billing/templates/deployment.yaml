apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: billing }
  template:
    metadata:
      labels: { app: billing }
    spec:
      containers:
        - name: billing
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: BILLING_DB_URL
              valueFrom: { secretKeyRef: { name: billing-db, key: url } }
