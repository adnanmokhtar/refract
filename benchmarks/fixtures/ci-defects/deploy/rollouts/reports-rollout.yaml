apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: reports
spec:
  replicas: 2
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reports
    scaleDown: progressively
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 5m }
        - setWeight: 100
