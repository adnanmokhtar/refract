apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels: { app: admin }
spec:
  replicas: 1
  selector:
    matchLabels: { app: admin }
  template:
    metadata:
      labels: { app: admin }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: admin
          image: ghcr.io/acme/shop-admin:2.3.1
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: admin-db, key: url } }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
