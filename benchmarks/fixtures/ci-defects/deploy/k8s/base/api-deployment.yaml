apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/acme/shop-api
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: api-db, key: url } }
            - name: REDIS_URL
              value: redis://redis.shop-prod.svc:6379
            - name: STRIPE_API_KEY
              valueFrom: { secretKeyRef: { name: stripe, key: api-key } }
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
