<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    <title>Harbor dispatch</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Harbor dispatch needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
    <!--
      Privacy-friendly page analytics for the dispatch team: no cookies, no personal data,
      and no session replay. Counts page views per route so the product team can see which
      screens dispatchers actually use during the morning peak.
      Loaded async so it never blocks the first render of the dispatch board.
    -->
    <script async defer data-domain="dispatch.harbor.example" src="https://plausible.io/js/script.js"></script>
  </body>
</html>
