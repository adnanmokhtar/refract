openapi: 3.1.0
info:
  title: Lumen Orders
  version: 2.3.0
servers:
  - url: https://api.lumen.test
paths:
  /v1/quotes/preview:
    post:
      operationId: previewQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotePreview' }
      responses:
        '200':
          description: The priced basket (nothing is created).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/subscriptions/{id}:
    delete:
      operationId: cancelSubscription
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancelled at period end; the body carries the last billed day.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
  /v1/warehouses/{id}:
    put:
      operationId: replaceWarehouse
      description: Replaces the warehouse representation; omitted optional fields are cleared.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Warehouse' }
      responses:
        '200': { description: The replaced warehouse. }
  /v1/checkout:
    post:
      operationId: checkout
      responses:
        '200': { description: Basket valid. }
        '422': { $ref: '#/components/responses/Error' }
  /v1/legacy/orders/{ref}:
    get:
      operationId: legacyOrder
      deprecated: true
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Legacy order. }
        default:
          description: Legacy error shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyError' }
components:
  responses:
    Error:
      description: The error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
    LegacyError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    QuotePreview:
      type: object
      required: [currency, lines, partnerReference]
      properties:
        currency: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/Line' } }
        partnerReference: { type: string }
    Line:
      type: object
      required: [productId, sku, quantity]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 999 }
    Quote:
      type: object
      properties:
        subtotal: { type: string }
        tax: { type: string }
        total: { type: string }
    Order:
      type: object
      required: [id, status, total, currency]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [open, paid, shipped, cancelled, refunded] }
        total: { type: string, example: '10.10' }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
    Subscription:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        endsOn: { type: string, format: date }
    Warehouse:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
        timeZone: { type: string }
