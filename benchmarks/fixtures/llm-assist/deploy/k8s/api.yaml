apiVersion: apps/v1
kind: Deployment
metadata:
  name: quill-api
  labels: { app: quill-api }
spec:
  replicas: 4
  selector:
    matchLabels: { app: quill-api }
  template:
    metadata:
      labels: { app: quill-api }
    spec:
      containers:
        - name: api
          image: registry.quilldesk.example/api:3.4.0
          ports: [{ containerPort: 3000 }]
          env:
            - { name: CHAT_MODEL, value: "gpt-4-0125-preview" }
            - { name: LLM_BASE_URL, value: "http://llm-proxy.internal:4000/v1" }
            - { name: SECONDARY_LLM_BASE_URL, value: "http://llm-proxy.internal:4000/secondary/v1" }
            - { name: OTEL_SERVICE_NAME, value: "quill-api" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4318" }
          envFrom:
            - secretRef: { name: quill-api }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quill-worker
  labels: { app: quill-worker }
spec:
  replicas: 3
  selector:
    matchLabels: { app: quill-worker }
  template:
    metadata:
      labels: { app: quill-worker }
    spec:
      containers:
        - name: worker
          image: registry.quilldesk.example/api:3.4.0
          command: ["node", "dist/orders/worker.main.js"]
          env:
            - { name: OPENAI_MODEL, value: "gpt-5.6-terra" }
          envFrom:
            - secretRef: { name: quill-api }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quill-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  rules:
    - host: api.quilldesk.example
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: quill-api, port: { number: 3000 } } } }
