# In-cluster NATS (deploy/k8s/nats.yaml mounts this file). JetStream carries the cash-on-delivery
# collection events from services/dispatch-go to the ledger (stream PAYMENTS, deploy/nats/streams/payments.json).
server_name: $POD_NAME
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 1G
  max_file_store: 50G
}

cluster {
  name: fulfilment
  port: 6222
  routes: [
    nats://nats-0.nats:6222
    nats://nats-1.nats:6222
    nats://nats-2.nats:6222
  ]
}
