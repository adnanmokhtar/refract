# The job Redis: BullMQ queues for apps/api and apps/worker, the Celery broker for services/billing-py,
# lock keys and the tracking stream. Runs as the redis-jobs StatefulSet (deploy/k8s/redis-jobs.yaml).
port 6379
bind 0.0.0.0
protected-mode yes
maxmemory 6gb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec
save 900 1
save 300 100
timeout 0
tcp-keepalive 300
