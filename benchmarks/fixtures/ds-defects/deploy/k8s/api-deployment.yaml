apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fulfilment
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/fulfilment-api:2.14.0
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          ports:
            - containerPort: 3000
            - containerPort: 50051
