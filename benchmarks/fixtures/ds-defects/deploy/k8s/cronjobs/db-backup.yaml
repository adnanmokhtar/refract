apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: fulfilment
spec:
  schedule: "15 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: ghcr.io/acme/pg-backup:1.4.2
