# Strangler façade in front of both halves. Ownership per route follows ai/migration/ledger.md:
# a V2-only feature routes every method to V2; a V2-canary feature routes reads only.

upstream v1_portal {
    server v1-portal.norrow.internal:8080;
}

upstream v2_api {
    server v2-api.norrow.internal:3000;
}

map $request_method $orders_upstream {
    default v1_portal;
    GET     v2_api;
    HEAD    v2_api;
}

map $request_method $invoices_upstream {
    default v1_portal;
    GET     v2_api;
    HEAD    v2_api;
}

server {
    listen 443 ssl;
    server_name app.norrow.example portal.norrow.example;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # orders: V2-canary, reads on V2; writes stay on V1 until the 2.4.0 write flip.
    location /api/orders {
        proxy_pass http://$orders_upstream;
    }

    # tickets: V2-only, every method (ledger F-tickets).
    location = /api/tickets {
        proxy_pass http://v2_api;
    }

    # invoices: V2-canary, reads only; issuing stays on V1 until the write flip.
    location /api/invoices { proxy_pass http://v2_api; }

    # wallets, stock, reports, admin: still V1.
    location /api/ {
        proxy_pass http://v1_portal;
    }

    location / {
        proxy_pass http://v1_portal;
    }

    # Signed export downloads. V1 checked `auth` + `signed` in the route; V2 has no such route, so
    # the façade asks the V2 API to authorise the request before serving the file itself.
    location /exports/ {
        auth_request /internal/authz/export;
        alias /srv/exports/;
    }

    location = /internal/authz/export {
        internal;
        proxy_pass http://v2_api/api/internal/authz/export$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
}
