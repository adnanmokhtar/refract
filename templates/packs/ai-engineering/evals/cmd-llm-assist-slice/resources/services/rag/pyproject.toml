[project]
name = "quill-rag"
version = "2.8.0"
description = "Retrieval, drafting and agent services for Quill Desk"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "anthropic==0.68.0",
  "openai==1.107.0",
  "langchain==1.0.3",
  "langchain-anthropic==1.0.1",
  "langchain-community==0.4.1",
  "langchain-openai==1.0.2",
  "langchain-postgres==0.0.16",
  "langgraph>=1.0.6",
  "langfuse==3.3.4",
  "llm-guard==0.3.16",
  "pgvector==0.4.1",
  "pinecone==7.3.0",
  "psycopg[binary]==3.2.10",
  "pydantic==2.11.9",
  "redis==6.4.0",
  "stripe==12.5.1",
  "tenacity==9.1.2",
  "tiktoken==0.11.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.pytest.ini_options]
markers = ["eval: scored evaluation against the golden sets", "integration: needs network"]
