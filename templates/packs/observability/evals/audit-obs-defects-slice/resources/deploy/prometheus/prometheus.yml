global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/*.rules.yml
  - ../slo/generated/*.yml
  - ../slo/pyrra/generated/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: api
    scrape_interval: 30s
    static_configs:
      - targets: ['api:3000']

  - job_name: orders-api
    static_configs:
      - targets: ['orders-api:8000']

  - job_name: inventory
    static_configs:
      - targets: ['inventory:8080']

  - job_name: refunds
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['refunds:8080']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Synthetic check of the storefront login journey.
  - job_name: login-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://api.harbor.example/health/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
