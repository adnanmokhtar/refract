user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens on;
  sendfile      on;
  keepalive_timeout  65;
  client_max_body_size  210m;

  log_format  main  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
  access_log  /var/log/nginx/access.log  main;

  upstream marketly_api {
    server api:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name marketly.example www.marketly.example localhost;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: every unknown path falls through to index.html for the client router.
    location / {
      try_files $uri /index.html;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location /api/ {
      proxy_pass http://marketly_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Seller uploads, written by the API into the shared data volume.
    location /uploads {
      alias /srv/marketly/uploads/;
      expires 7d;
    }
  }
}
