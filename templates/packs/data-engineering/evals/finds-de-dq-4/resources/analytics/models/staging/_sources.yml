version: 2

sources:
  - name: shop
    schema: raw_shop
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 6, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: orders
        description: One row per order as the shop database holds it.
        freshness:
          warn_after: {count: 2, period: hour}
        columns:
          - name: order_id
          - name: legacy_status
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
      - name: customers
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
      - name: events
        description: One row per tracked event; append-only, deduplicated by event_id downstream.
      - name: refunds
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
      - name: order_lines
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
      - name: sessions
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
      - name: page_views
        description: Raw tracker page views; the raw dataset keeps 30 days.
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
      - name: products
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
      - name: stores
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
      - name: promotions
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
      - name: legacy_coupons
        description: Coupon codes from the 2019 platform; nothing has read them since the 2024 cutover.
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}

  - name: ads
    schema: raw_ads
    tables:
      - name: impressions
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
      - name: spend
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 36, period: hour}
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}

  - name: reference
    schema: raw_reference
    freshness: null
    tables:
      - name: countries
        data_tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments: {min_value: 1}
