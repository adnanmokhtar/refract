apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tallyhook
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: registry.example.com/tallyhook/api:1.5.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: tallyhook-config
            - secretRef:
                name: tallyhook-api
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tallyhook
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tallyhook-config
  namespace: tallyhook
data:
  LOG_FORMAT: json
  LOG_LEVEL: info
  REPORTS_TIMEZONE: UTC
