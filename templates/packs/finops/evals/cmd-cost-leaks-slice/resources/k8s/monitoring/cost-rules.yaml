apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cost-guardrails
  labels:
    release: quaywise
    team: platform
spec:
  groups:
    - name: cost
      rules:
        - alert: LlmGatewayTokenBurnHigh
          expr: sum(rate(llm_gateway_tokens_total[1h])) * 3600 > 4e6
          for: 30m
          labels:
            severity: warning
            category: cost
          annotations:
            summary: Model gateway tokens per hour are above the planned 4M.
        # Muted 2026-08-12 during the carrier migration.
