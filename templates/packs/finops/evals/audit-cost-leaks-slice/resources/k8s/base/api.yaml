apiVersion: apps/v1
kind: Deployment
metadata:
  name: quaywise-api
  labels:
    app.kubernetes.io/name: quaywise-api
    team: dispatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: quaywise-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quaywise-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: registry.quaywise.example/quaywise-api:1.42.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: quaywise-config
            - secretRef:
                name: quaywise-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: quaywise-api
spec:
  selector:
    app.kubernetes.io/name: quaywise-api
  ports:
    - port: 3000
      targetPort: 3000
