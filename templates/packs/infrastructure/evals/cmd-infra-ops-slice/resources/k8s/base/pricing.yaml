apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pricing
  template:
    metadata:
      labels:
        app: pricing
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pricing
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: pricing
          image: registry.larder.example/larder/pricing@sha256:a8629d8445fc422be092f75e0b4296e386216e6dbf7769a2a233f0e7167eb101
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PRICING_DB_HOST
              value: pricing-db.larder.internal
            - name: PRICING_DB_PORT
              value: "5432"
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pricing
spec:
  selector:
    app: pricing
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pricing
spec:
  scaleTargetRef:
    name: pricing
  minReplicaCount: 2
  maxReplicaCount: 8
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "65"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pricing
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: pricing
